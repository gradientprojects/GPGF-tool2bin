<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPGF-Tool2Bin</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main>
    <h1>GPGF-Tool2Bin</h1>
    <p class="tag">Photo of a tool &rarr; Gridfinity bin STEP. Everything runs in
      your browser &mdash; photos never leave your device.</p>

    <section id="checks">
      <h2>Engine self-test</h2>
      <div class="check" id="check-cad"><span class="dot"></span>
        CAD kernel (OpenCASCADE): <b class="st">loading…</b></div>
      <div class="check" id="check-cv"><span class="dot"></span>
        Vision (OpenCV + ArUco): <b class="st">loading…</b></div>
      <pre id="caps"></pre>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
